<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="GuardianAI - All-in-One Real-Time Human Safety Ecosystem" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <title>GuardianAI | All-in-One Human Safety Ecosystem</title>

  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-red-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA offline operation
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('GuardianAI PWA ServiceWorker active:', reg.scope))
            .catch(err => console.log('ServiceWorker registration error:', err));
        });
      }
    </script>
  </body>
</html>
